function genRoom(i){

 G={rm:null,ri:0,coins:0,echo:null,bench:{ri:0},vis:{},RS:{},mode:'title',fade:0,fdir:0,pend:null,ban:{t:0,a:'',b:''},shake:0,hs:0,dlg:null,runes:0,time:0,fx:[],S:[],toast:{s:'',t:0},near:null,mapOpen:false};
}
function startGame(){newGame0()}
function newGame0(){G.mode='trans';G.fade=1;G.fdir=-1;enterRoom(0,'bench');}
function restart(){newGame();newGame0()}

function mkEnemy(e){
 const hp=e.hp;
 if(e.k=='w')return{k:'w',x:e.x,y:e.y,w:30,h:26,vx:(Math.random()<.5?-1:1)*55,vy:0,kx:0,hp,mh:hp,fl:0,dead:0};
 if(e.k=='h')return{k:'h',x:e.x,y:e.y,w:26,h:26,vx:0,vy:0,kx:0,hp,mh:hp,fl:0,t:Math.random()*1.5,dead:0};
 return{k:'f',x:e.x,y:e.y,w:28,h:28,bx:e.x,by:e.y,ph:Math.random()*6,kx:0,hp,mh:hp,fl:0,dead:0};
}
function mkBoss(R){const hp=14+R.i;return{k:'B',x:(R.W-10)*T,y:FY*T-86,w:64,h:86,hp,mh:hp,fl:0,vx:0,vy:0,st:'idle',t:1.2,d:-1,on:0,dead:0,ph2:0,g:false,name:BOSS[R.i]}}
function spawnEnemies(R){
 R.es=[];R.pr=[];const S=R.st;
 if(R.boss){if(!S.boss)R.es.push(mkBoss(R));}
 else if(!(R.v=='kill'&&S.done))R.ens.forEach(e=>R.es.push(mkEnemy(e)));
}
function enterRoom(i,how){
 const R=ROOMS[i]||(ROOMS[i]=genRoom(i));G.rm=R;G.ri=i;G.vis[i]=1;
 R.st=G.RS[i]||(G.RS[i]={read:0,xr:0,done:0,open:0,gate:0,sh:[0,0,0],boss:0,alt:0});
 R.lock=false;spawnEnemies(R);
 p.vx=p.vy=0;p.dashT=0;p.heal=0;p.atk=0;p.wall=0;p.wallT=0;p.auto=0;p.inv=Math.max(p.inv,.5);
 if(how=='left'){p.x=1.2*T;p.auto=.4;p.autoD=1;p.f=1}
 else if(how=='right'){p.x=(R.W-1.8)*T;p.auto=.4;p.autoD=-1;p.f=-1}
 else{p.x=R.bench.x-p.w/2}
 p.y=FY*T-p.h;p.safe={x:p.x,y:p.y};p.g=true;
 G.ban={t:3.4,a:R.E.n,b:R.E.y};
 mkLayers(R);camUpdate(1,0);
}
function go(i,how){G.pend={i,how};G.mode='trans';G.fdir=1}
function say(title,text,cb){G.dlg={title,text,n:0,cb};G.mode='dialog'}
function toast(s,t){G.toast={s,t:t||2.4}}
function burst(x,y,n,c){for(let k=0;k<n;k++)G.fx.push({x,y,vx:(Math.random()-.5)*320,vy:(Math.random()-.8)*300,t:.4+Math.random()*.4,c,s:2+Math.random()*3})}

function buildSolids(R){
 const a=R.sol.slice();
 if(R.st.gate<.85)a.push([R.gx,2*T,T,13*T]);
 if(R.lock)a.push([3*T,2*T,T,13*T]);
 if(R.i==0)a.push([-T,0,T,RH*T]);
 return a;
}
function mv(o,dx,dy,S){
 let hx=0,hy=0;
 o.x+=dx;
 for(const r of S)if(!r[4]&&ovr(o,r)){if(dx>0){o.x=r[0]-o.w;hx=1}else if(dx<0){o.x=r[0]+r[2];hx=-1}}
 const pb=o.y+o.h;
 o.y+=dy;
 if(dy<0&&S.some(r=>!r[4]&&ovr(o,r))){
  out:for(const s of[4,8,12,16])for(const sg of[1,-1]){
   const t={x:o.x+s*sg,y:o.y,w:o.w,h:o.h};
   if(!S.some(r=>!r[4]&&ovr(t,r))){o.x=t.x;break out}
  }
 }
 for(const r of S)if(ovr(o,r)){
  if(r[4]){if(dy>0&&pb<=r[1]+.5){o.y=r[1]-o.h;hy=1}}
  else if(dy>0){o.y=r[1]-o.h;hy=1}else if(dy<0){o.y=r[1]+r[3];hy=-1}
 }
 return[hx,hy];
}

addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
 if(!K[e.code])P[e.code]=1;K[e.code]=1;
});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0});
addEventListener('pointerdown',e=>{
 if(e.pointerType!=='mouse')return;
 if(e.target&&e.target.closest&&e.target.closest('.tb,#h'))return;
 if(e.button===0){if(!K.Mouse0)P.Mouse0=1;K.Mouse0=1}
 else if(e.button===2){if(!K.Mouse2)P.Mouse2=1;K.Mouse2=1}
});
addEventListener('pointerup',e=>{if(e.button===0)K.Mouse0=0;else if(e.button===2)K.Mouse2=0});
addEventListener('contextmenu',e=>e.preventDefault());

function hurt(n,dir){
 if(p.inv>0||G.mode!='play')return;
 p.hp-=n;p.inv=1.2;p.vx=dir*260;p.vy=-300;p.dashT=0;p.heal=0;p.atk=0;G.shake=.35;G.hs=.12;
 burst(p.x+11,p.y+19,14,'#fff');
 if(p.hp<=0)die();
}
function die(){
 G.echo={ri:G.ri,x:p.x,y:p.y,c:G.coins,cd:1.5};G.coins=0;p.hp=p.mhp;p.soul=0;
 G.pend={i:G.bench.ri,how:'bench'};G.mode='trans';G.fdir=1;
 toast('Você caiu... suas moedas ficaram em um eco',4);
}
function spikeHit(){
 if(p.inv<=0)hurt(1,0);
 if(G.mode=='trans'&&G.fdir>0)return;
 p.x=p.safe.x;p.y=p.safe.y;p.vx=p.vy=0;p.inv=Math.max(p.inv,1.1);
}
function killEnemy(e){
 e.dead=1;const R=G.rm;burst(e.x+e.w/2,e.y+e.h/2,18,'#dde');
 if(e.k=='B'){
  G.coins+=60;R.st.boss=1;R.st.done=1;R.st.open=1;R.lock=false;R.pr=[];G.shake=.6;
  say('Presente — '+R.E.m,R.E.r,()=>{if(WB[R.i])giveWeapon(WB[R.i]);else toast('O caminho se abriu')});
 }else{
  G.coins+=3+Math.floor(G.ri/4);
  if(R.v=='kill'&&!R.st.done&&R.es.every(x=>x.dead))toast('Os guardiões caíram — ative o mecanismo');
 }
}
function giveWeapon(t){
 if(t>p.wp){p.wp=t;say('Nova arma — '+SW[t].n,SW[t].t)}else toast('Você já tem uma lâmina melhor');
}
function dmg(e,n){
 e.hp-=n;e.fl=.1;p.soul=Math.min(99,p.soul+11);G.hs=.05;G.shake=Math.max(G.shake,.12);
 burst(e.x+e.w/2,e.y+e.h/2,6,'#fff');
 if(e.hp<=0&&!e.dead)killEnemy(e);
}

function updEnemy(e,dt,S){
 e.fl-=dt;
 if(e.k=='f'){
  const dx=p.x+11-(e.bx+14),dy=p.y+19-(e.by+14),d=Math.hypot(dx,dy)||1;
  if(d<320){e.bx+=dx/d*48*dt;e.by+=dy/d*30*dt}
  e.bx+=e.kx*dt;e.kx*=Math.pow(.001,dt);
  e.bx=clamp(e.bx,4*T,(G.rm.W-5)*T);e.by=clamp(e.by,3*T,(FY-2)*T);
  e.x=e.bx;e.y=e.by+Math.sin(G.time*2+e.ph)*20;return;
 }
 e.vy=Math.min(880,e.vy+2200*dt);e.kx*=Math.pow(.001,dt);
 const[hx,hy]=mv(e,(e.vx+e.kx)*dt,e.vy*dt,S);
 if(hy)e.vy=0;
 if(e.y>RH*T+10){
  e.dead=1;const R=G.rm;
  if(R.v=='kill'&&!R.st.done&&R.es.every(x=>x.dead))toast('Os guardiões caíram — ative o mecanismo');
  return;
 }
 if(e.k=='w'){
  if(hx)e.vx*=-1;
  if(hy>0&&!solidAt(S,e.vx>0?e.x+e.w+4:e.x-4,e.y+e.h+6))e.vx*=-1;
 }else{
  e.t-=dt;
  if(hy>0){e.vx*=.8;const dx=p.x-e.x;if(e.t<=0&&Math.abs(dx)<380){e.vy=-560;e.vx=Math.sign(dx)*170;e.t=1+Math.random()*.8}}
  if(hx)e.vx=0;
 }
}
function updBoss(b,dt,S){
 const R=G.rm;b.fl-=dt;
 b.vy=Math.min(900,b.vy+2200*dt);
 if(!b.on){
  if(p.x>R.W*T*.3){b.on=1;R.lock=true;G.ban={t:3.4,a:b.name,b:'Guardião de '+R.E.n}}
  const[,hy]=mv(b,0,b.vy*dt,S);if(hy)b.vy=0;return;
 }
 if(!b.ph2&&b.hp<=b.mh/2){b.ph2=1;G.shake=.4}
 b.t-=dt;
 if(b.st=='idle'){
  b.vx=0;b.d=p.x<b.x?-1:1;
  if(b.t<=0){
   if(Math.random()<.5){b.st='charge';b.t=.9;b.vx=b.d*(b.ph2?560:470)}
   else{b.st='leap';b.t=.4;b.vy=-860;b.vx=b.d*330}
  }
 }else if(b.st=='charge'){if(b.t<=0){b.st='idle';b.t=.8;b.vx=0}}
 else if(b.st=='leap'){
  if(b.g&&b.t<=0){
   b.st='idle';b.t=.9;b.vx=0;G.shake=.3;
   if(b.ph2){R.pr.push({x:b.x+b.w/2,y:FY*T-22,w:26,h:22,vx:280,t:2.2},{x:b.x+b.w/2-26,y:FY*T-22,w:26,h:22,vx:-280,t:2.2})}
  }
 }
 const[hx,hy]=mv(b,b.vx*dt,b.vy*dt,S);
 b.g=hy>0;if(hy)b.vy=0;
 if(hx){b.vx*=-1;b.d*=-1}
}

function useMech(){
 const R=G.rm,S=R.st;
 if(S.done){toast('Este mecanismo já foi ativado');return}
 if(R.v=='kill'){const n=R.es.filter(e=>!e.dead).length;if(n>0){toast('Derrote os guardiões ('+n+' restantes)');return}}
 if(R.v=='shard'){const c=S.sh.reduce((a,b)=>a+b,0);if(c<3){toast('Faltam fragmentos ('+c+'/3) — procure nas alturas');return}}
 S.done=1;
 say('Presente — '+R.E.m,R.E.r,()=>{S.open=1;toast('O caminho se abriu')});
}
function rest(){
 const R=G.rm;p.hp=p.mhp;p.soul=Math.max(p.soul,33);G.bench.ri=G.ri;
 spawnEnemies(R);G.ban={t:2.2,a:'Marco de descanso',b:'Vida restaurada. Os inimigos voltaram.'};
}
function interactables(){
 const R=G.rm,S=R.st,a=[];
 a.push({x:R.rune.x,y:R.rune.y,t:'Ler runa',f:()=>say('Runa — o Passado',R.E.p,()=>{if(!S.read){S.read=1;G.runes++}})});
 a.push({x:R.extra.x,y:R.extra.y,t:'Ler fragmento',f:()=>say('Fragmento de memória',R.E.x,()=>{if(!S.xr){S.xr=1;G.runes++;G.coins+=15;toast('+15 moedas')}})});
 if(!R.boss)a.push({x:R.mech.x,y:R.mech.y,t:R.E.m,f:useMech});
 if(R.bench)a.push({x:R.bench.x,y:R.bench.y,t:'Descansar',f:rest});
 if(R.wp&&!S.wpg)a.push({x:R.wp.x,y:R.wp.y,t:SW[R.wp.t].n,f:()=>{S.wpg=1;giveWeapon(R.wp.t)}});
 if(R.alt&&!S.alt)a.push({x:R.alt.x,y:R.alt.y,t:R.alt.a.n,f:()=>{S.alt=1;p.ab[R.alt.a.k]=1;say(R.alt.a.n,R.alt.a.t)}});
 return a;
}

function camUpdate(snap,dt){
 const R=G.rm;
 const tx=clamp(p.x+11-VW/2+p.f*40,0,Math.max(0,R.W*T-VW)),ty=clamp(p.y-VH/2+40,0,RH*T-VH);
 if(snap){cam.x=tx;cam.y=ty}else{const k=Math.min(1,dt*6);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k}
}

function updPlay(dt,lockIn){
 const R=G.rm,S=R.st;G.S=buildSolids(R);const SO=G.S;
 const L=!lockIn&&kd('ArrowLeft','KeyA'),Rt=!lockIn&&kd('ArrowRight','KeyD'),U=!lockIn&&kd('ArrowUp','KeyW'),DN=!lockIn&&kd('ArrowDown','KeyS');
 let d=(Rt?1:0)-(L?1:0),locked=!!lockIn;
 if(p.auto>0){p.auto-=dt;d=p.autoD;locked=true}
 if(p.inv>0)p.inv-=dt;if(p.atkCd>0)p.atkCd-=dt;if(p.dashCd>0)p.dashCd-=dt;if(p.wallT>0)p.wallT-=dt;
 p.coy=p.g?.14:p.coy-dt;
 p.jb=(!locked&&kp('Space','KeyC'))?.15:p.jb-dt;
 if(S.open&&S.gate<1)S.gate=Math.min(1,S.gate+dt*1.1);
 if(!locked&&kp('KeyZ','KeyK','ShiftLeft','ShiftRight','Mouse2')&&p.dashCd<=0&&(p.g||!p.dAir)&&p.heal<=0&&p.dashT<=0){typeof sfx=='function'&&sfx('d');p.dashT=.2;p.dashCd=p.ab.dash?.3:.5;p.inv=Math.max(p.inv,.22);p.atk=0;if(!p.g)p.dAir=true;p.f=d||p.f;burst(p.x+11,p.y+34,6,'#ccc')}
 if(!locked&&kp('KeyX','KeyJ','Mouse0')&&p.atkCd<=0&&p.heal<=0&&p.dashT<=0){p.atk=.2;p.atkCd=Math.max(.22,.34-p.wp*.02);p.up=U;p.dn=DN&&!p.g&&!U;p.hit=[];p.pg=0}
 if(p.dashT>0){p.dashT-=dt;p.vy=0;p.vx=p.f*((p.g?520:600)+(p.ab.dash?60:0))}
 else{
  if(p.wallT<=0){const sp=p.heal>0?0:250;p.vx+=(d*sp-p.vx)*Math.min(1,dt*(p.g?16:9));if(d&&p.heal<=0)p.f=d}
  p.vy=Math.min((p.wall&&p.vy>0)?130:880,p.vy+2200*dt);
 }
 if(p.jb>0&&p.heal<=0&&p.dashT<=0&&!locked){
  if(p.coy>0){typeof sfx=='function'&&sfx('j');p.vy=-740;p.coy=0;p.jb=0;p.dj=1;p.g=false;burst(p.x+11,p.y+38,6,'#ccc')}
  else if(p.wall&&p.ab.wall){typeof sfx=='function'&&sfx('j');p.vy=-720;p.vx=-p.wall*300;p.f=-p.wall;p.wallT=.16;p.wall=0;p.jb=0;p.dj=1}
  else if(p.ab.dj&&p.dj==1){typeof sfx=='function'&&sfx('j');p.vy=-680;p.dj=2;p.jb=0;burst(p.x+11,p.y+38,8,'#9cf')}
 }
 if(!locked&&!kd('Space','KeyC')&&p.vy<-220&&p.dashT<=0&&!p.pb)p.vy*=.55;
 if(p.vy>=0||p.g)p.pb=0;
 if(!p.g&&p.coy<=0&&p.dj==0)p.dj=1;
 const wantHeal=!locked&&kd('KeyF','KeyH')&&p.soul>=33&&p.hp<p.mhp&&p.g&&Math.abs(p.vx)<30&&p.atk<=0&&p.dashT<=0;
 p.heal=wantHeal?p.heal+dt:0;
 if(p.heal>=.9){p.hp++;p.soul-=33;p.heal=0;burst(p.x+11,p.y+19,16,'#9cf')}
 p.g=false;
 const[hx]=mv(p,p.vx*dt,0,SO);if(hx)p.vx=0;
 const[,hy]=mv(p,0,p.vy*dt,SO);
 if(hy>0){p.g=true;p.vy=0;p.dj=0;p.dAir=false}else if(hy<0)p.vy=0;
 p.wall=0;
 if(!p.g&&p.ab.wall&&p.dashT<=0){
  const a={x:p.x-2,y:p.y+4,w:2,h:p.h-8},b={x:p.x+p.w,y:p.y+4,w:2,h:p.h-8};
  if(d<0&&SO.some(r=>!r[4]&&ovr(a,r)))p.wall=-1;else if(d>0&&SO.some(r=>!r[4]&&ovr(b,r)))p.wall=1;
 }
 if(p.g&&solidAt(SO,p.x-6,p.y+p.h+4)&&solidAt(SO,p.x+p.w+6,p.y+p.h+4)){p.safe.x=p.x;p.safe.y=p.y}
 for(const h of R.haz){if(ov(p,{x:h[0]*T,y:h[1]*T+10,w:h[2]*T,h:h[3]*T})){spikeHit();break}}
 if(p.y>RH*T+40)spikeHit();
 if(p.atk>0){
  p.atk-=dt;
  if(p.atk<.16&&p.atk>.04){
   const w=SW[p.wp],r=w.r;let hb,bounce=0;
   if(p.up)hb={x:p.x+p.w/2-30,y:p.y-r+8,w:60,h:r+8};
   else if(p.dn)hb={x:p.x+p.w/2-30,y:p.y+p.h-14,w:60,h:r+14};
   else hb={x:p.f>0?p.x+p.w-6:p.x-r+6,y:p.y-2,w:r,h:42};
   for(const e of R.es){
    if(e.dead||(e.k=='B'&&!e.on)||p.hit.includes(e))continue;
    if(ov(hb,e)){p.hit.push(e);dmg(e,w.d);if(p.dn)bounce=1;else{const dir=p.up?0:p.f;if(e.k!='B')e.kx=dir*260;p.vx-=dir*70}}
   }
   if(p.dn)for(const h of R.haz)if(ov(hb,{x:h[0]*T,y:h[1]*T+10,w:h[2]*T,h:h[3]*T}))bounce=1;
   if(bounce&&!p.pg){p.pg=1;p.vy=-740;p.pb=1;p.dj=1;p.dAir=false;p.inv=Math.max(p.inv,.2);p.dashCd=0;burst(p.x+11,p.y+p.h,8,'#fff')}
  }
 }
 for(const e of R.es){
  if(e.dead)continue;
  if(e.k=='B')updBoss(e,dt,SO);else updEnemy(e,dt,SO);
  if((e.k!='B'||e.on)&&ov(p,e))hurt(1,(p.x+11<e.x+e.w/2)?-1:1);
 }
 for(const q of R.pr){q.x+=q.vx*dt;q.t-=dt;if(ov(p,q))hurt(1,q.vx>0?1:-1)}
 R.pr=R.pr.filter(q=>q.t>0);
 if(R.v=='shard')R.shards.forEach((s,k)=>{if(!S.sh[k]&&ov(p,{x:s.x-12,y:s.y-12,w:24,h:24})){S.sh[k]=1;burst(s.x,s.y,10,'#8cf');toast('Fragmento '+S.sh.reduce((a,b)=>a+b,0)+'/3')}});
 if(G.echo&&G.mode=='play'&&G.echo.ri==G.ri){
  if(G.echo.cd>0)G.echo.cd-=dt;
  else if(ov(p,{x:G.echo.x,y:G.echo.y,w:22,h:38})){G.coins+=G.echo.c;G.echo=null;toast('Você recuperou suas moedas')}
 }
 G.near=null;
 if(p.g&&!locked){G.near=interactables().find(o=>Math.abs(p.x+11-o.x)<46&&Math.abs(p.y+p.h-o.y)<30)||null;
  if(G.near&&kp('KeyE','ArrowDown'))G.near.f();}
 const cxp=p.x+p.w/2;
 if(G.mode=='play'){
  if(cxp<0&&G.ri>0)go(G.ri-1,'right');
  else if(cxp>R.W*T){if(G.ri<NR-1)go(G.ri+1,'left');else G.mode='end'}
 }
 camUpdate(0,dt);
}

function update(dt){
 G.time+=dt;
 for(const m of MOTES){m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.y<-5){m.y=VH+5;m.x=Math.random()*VW}if(m.x<-5)m.x=VW+5;if(m.x>VW+5)m.x=-5}
 if(kp('KeyN')&&window.toggleMusic)window.toggleMusic();
 if(G.mode=='title'){if(kp('Enter','Space','KeyE','Mouse0'))startGame();return}
 if(G.mode=='end'){if(kp('KeyR'))restart();return}
 if(kp('KeyR')&&G.mode!='dialog'){restart();return}
 if(G.ban.t>0)G.ban.t-=dt;if(G.toast.t>0)G.toast.t-=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
 for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=600*dt;f.t-=dt}G.fx=G.fx.filter(f=>f.t>0);
 if(G.mode=='dialog'){
  const d=G.dlg;d.n=Math.min(d.text.length,d.n+dt*60);
  if(kp('KeyE','Enter','Space','KeyX','Mouse0')){
   if(d.n<d.text.length)d.n=d.text.length;
   else{G.mode='play';G.dlg=null;if(d.cb)d.cb()}
  }
  return;
 }

 g.fillStyle='rgba(0,0,0,.75)';g.fillRect(VW/2-w/2,VH-100,w,30);g.fillStyle='#f2eee2';g.textAlign='center';g.fillText(t.s,VW/2,VH-80);g.globalAlpha=1;
}
function wrap(text,maxW){
 const words=text.split(' '),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);return lines;
}
function drawDialog(){
 const d=G.dlg;if(!d)return;const hu=G.rm.E.hu,x=70,y=VH-205,w=VW-140,h=170;
 g.fillStyle='rgba(6,6,10,.94)';g.fillRect(x,y,w,h);g.strokeStyle=hsl(hu,50,65,.7);g.lineWidth=1.5;g.strokeRect(x+.5,y+.5,w,h);
 g.textAlign='left';g.fillStyle=hsl(hu,60,75);g.font='italic 20px Georgia,serif';g.fillText(d.title,x+26,y+36);
 g.font='17px Georgia,serif';g.fillStyle='#e8e4d8';
 const lines=wrap(d.text,w-52);let left=Math.floor(d.n),ly=y+72;
 for(const ln of lines){if(left<=0)break;g.fillText(ln.slice(0,left),x+26,ly);left-=ln.length+1;ly+=26}
 if(d.n>=d.text.length){g.textAlign='right';g.font='13px sans-serif';g.fillStyle='rgba(232,228,216,.6)';g.fillText('[E] continuar',x+w-20,y+h-14)}
}
function mapPos(i){const r=Math.floor(i/7),c=(r%2==0)?i%7:6-i%7;return[c,r]}
function drawMap(){
 g.fillStyle='rgba(4,4,8,.95)';g.fillRect(0,0,VW,VH);
 g.textAlign='center';g.fillStyle='#f2eee2';g.font='italic 30px Georgia,serif';g.fillText('Mapa das Eras',VW/2,56);
 const cw=124,ch=88,x0=(VW-6*cw)/2,y0=120;
 g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=2;
 for(let i=0;i<NR-1;i++){if(!G.vis[i])continue;const[a,b]=mapPos(i),[c,d]=mapPos(i+1);g.beginPath();g.moveTo(x0+a*cw,y0+b*ch);g.lineTo(x0+c*cw,y0+d*ch);g.stroke()}
 for(let i=0;i<NR;i++){
  const[a,b]=mapPos(i),x=x0+a*cw,y=y0+b*ch,v=G.vis[i],E=ERAS[i];
  if(!v&&!(i>0&&G.vis[i-1]))continue;
  g.fillStyle=v?hsl(E.hu,28,16):'rgba(255,255,255,.04)';g.strokeStyle=v?hsl(E.hu,50,60,.8):'rgba(255,255,255,.2)';g.lineWidth=1.5;
  g.fillRect(x-48,y-26,96,52);g.strokeRect(x-48,y-26,96,52);
  g.fillStyle='#e8e4d8';g.font='13px Georgia,serif';g.fillText(v?(i+1)+' · '+E.y:'?',x,y+4);
  if(v&&ROOMS[i]&&ROOMS[i].bench){g.fillStyle='#ffcf70';g.beginPath();g.arc(x+38,y-18,3,0,7);g.fill()}
  if(i==G.ri){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x-52,y-30,104,60)}
 }
 g.fillStyle='#e8e4d8';g.font='italic 20px Georgia,serif';g.fillText(G.rm.E.n,VW/2,430);
 g.font='13px sans-serif';g.fillStyle='rgba(232,228,216,.65)';g.fillText('Runas lidas: '+G.runes+' / '+NR*2+'    ·    Moedas: '+G.coins+'    ·    [M] fechar',VW/2,462);
}

 const gr=g.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#10131c');gr.addColorStop(1,'#050509');g.fillStyle=gr;g.fillRect(0,0,VW,VH);
 g.fillStyle='rgba(180,200,230,1)';for(const m of MOTES){g.globalAlpha=m.a;g.fillRect(m.x,m.y,m.s,m.s)}g.globalAlpha=1;

function drawEnd(){
 g.fillStyle='#050509';g.fillRect(0,0,VW,VH);g.textAlign='center';g.fillStyle='#f2eee2';
 g.font='italic 54px Georgia,serif';g.fillText('Fim do protótipo',VW/2,200);

function draw(){
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,VW,VH);
 if(G.mode=='title'){drawTitle();return}
 if(G.mode=='end'){drawEnd();return}
 const ox=(Math.random()-.5)*G.shake*16,oy=(Math.random()-.5)*G.shake*16;
 g.save();g.translate(ox,oy);drawBG();drawWorld();drawEnts();drawPlayer();drawFG();g.restore();
 drawLight();drawHUD();drawBanner();drawToast();
 if(G.mode=='dialog')drawDialog();
 if(G.mode=='map')drawMap();
 if(G.fade>0){g.fillStyle='rgba(0,0,0,'+G.fade+')';g.fillRect(0,0,VW,VH)}
}
let last=performance.now();
function loop(n){
 const dt=Math.min(.033,(n-last)/1000);last=n;
 try{update(dt);draw()}catch(e){console.error(e)}
 if(G.keep)G.keep=0;else for(const k in P)P[k]=0;
 requestAnimationFrame(loop);
}
newGame();requestAnimationFrame(loop);

(function(){
 const body=document.body,cvs=document.getElementById('c');
 const coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
 if(coarse)body.classList.add('touch');
 const tg=document.getElementById('tg');
 if(tg)tg.onclick=()=>body.classList.toggle('touch');
 addEventListener('touchstart',()=>body.classList.add('touch'),{once:true,passive:true});
 document.addEventListener('contextmenu',e=>e.preventDefault());
 const active=new Map();
 const press=c=>{K[c]=1;P[c]=1},release=c=>{K[c]=0};
 const find=(x,y)=>{const e=document.elementFromPoint?document.elementFromPoint(x,y):null;return e&&e.closest?e.closest('.tb[data-k]'):null};
 function sw(pid,el){
  const cur=active.get(pid);if(cur&&cur.el===el)return;
  if(cur){release(cur.el.dataset.k);cur.el.classList.remove('on');active.delete(pid)}
  if(el){press(el.dataset.k);el.classList.add('on');active.set(pid,{el})}
 }
 function up(e){
  const cur=active.get(e.pointerId);
  if(cur){release(cur.el.dataset.k);cur.el.classList.remove('on');active.delete(e.pointerId)}
 }
 document.querySelectorAll('.tb[data-k]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}sw(e.pointerId,b)});
  b.addEventListener('pointermove',e=>{
   const cur=active.get(e.pointerId);if(!cur)return;
   const el=find(e.clientX,e.clientY);
   if(el&&el!==cur.el&&el.dataset.g&&el.dataset.g===cur.el.dataset.g)sw(e.pointerId,el);
  });
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
 });
 window.addEventListener('blur',()=>{active.forEach(c=>{release(c.el.dataset.k);c.el.classList.remove('on')});active.clear()});
 cvs.addEventListener('pointerdown',()=>{
  const m=G&&G.mode;
  if(m=='title'||m=='dialog')P.Enter=1;else if(m=='end')P.KeyR=1;else if(m=='map')P.KeyM=1;
 });
 const mus=new Audio('musica.mp3');mus.loop=true;mus.volume=1;mus.preload='auto';
 let muted=false,started=false;
 function startMusic(){if(started||muted)return;const pr=mus.play();if(pr&&pr.then)pr.then(()=>{started=true}).catch(()=>{})}
 ['pointerdown','keydown','touchstart'].forEach(t=>addEventListener(t,startMusic,{passive:true}));
 window.toggleMusic=()=>{muted=!muted;if(muted){mus.pause();started=false}else startMusic();if(window.toast)toast(muted?'Música desligada':'Música ligada',1.5)};
 window.__mus=mus;
 const SF={j:new Audio('pulo.mp3'),d:new Audio('esquiva.mp3')};
 for(const k in SF){SF[k].preload='auto';SF[k].volume=k=='j'?.7:.8}
 window.sfx=k=>{try{const a=SF[k].cloneNode();a.volume=SF[k].volume;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(_){}};
})();


</script></body></html>
